<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor de PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><div><strong>Editor PDF</strong><span>System · Local</span></div><button id="newFileButton" class="icon-button" title="Abrir outro PDF">+</button></div>
        <label class="upload" for="pdfInput"><input id="pdfInput" type="file" accept="application/pdf" /><span>Selecionar PDF</span></label>
        <div class="file-meta" id="fileMeta">Nenhum arquivo aberto</div>
        <div class="pages-head"><span>Páginas</span><span id="pageCount">0</span></div>
        <div id="thumbs" class="thumbs"></div>
      </aside>
      <main class="workspace">
        <header class="toolbar">
          <div class="tool-group">
            <button class="tool active" data-tool="select" title="Selecionar">↖</button>
            <button class="tool" data-tool="text" title="Texto">T</button>
            <button class="tool" data-tool="highlight" title="Destacar">▰</button>
            <button class="tool" data-tool="rect" title="Retângulo">□</button>
            <button class="tool" data-tool="signature" title="Assinatura">✍</button>
            <label class="tool file-tool" title="Imagem">IMG<input id="imageInput" type="file" accept="image/png,image/jpeg" /></label>
          </div>
          <div class="tool-group controls">
            <label>Cor <input id="colorInput" type="color" value="#f472b6" /></label>
            <label>Tamanho <input id="fontSizeInput" type="number" min="8" max="72" value="18" /></label>
            <label>Zoom <input id="zoomInput" type="range" min="70" max="180" value="110" /></label>
          </div>
          <div class="tool-group actions"><button id="rotateButton" title="Girar página">Girar</button><button id="deleteButton" title="Remover página">Excluir</button><button id="undoButton" title="Desfazer">Desfazer</button><button id="exportButton" class="primary">Exportar PDF</button></div>
        </header>
        <section class="stage-wrap">
          <div id="emptyState" class="empty-state"><h1>Abra um PDF para começar</h1><p>Depois, use a barra superior para adicionar texto, marcações, assinatura e imagens.</p></div>
          <div id="stage" class="stage hidden"><canvas id="pdfCanvas"></canvas><div id="overlay" class="overlay"></div></div>
        </section>
        <div class="status" id="status">Pronto</div>
      </main>
    </div>
    <div id="textModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-panel"><h2>Adicionar texto</h2><textarea id="textValue" rows="4" placeholder="Digite o texto"></textarea><div class="modal-actions"><button id="cancelText">Cancelar</button><button id="confirmText" class="primary">Adicionar</button></div></div></div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
